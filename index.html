<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#101c29" />
    <meta name="description" content="RotorLoop: an asynchronous FPV arena with cancellable asset loading, a live room lobby, sprite rendering, and Web Audio." />
    <title>RotorLoop — FPV Drone Arena</title>
  </head>
  <body>
    <main aria-label="RotorLoop FPV training arena">
      <canvas id="arena" tabindex="0" aria-label="Fly with W or Up. Turn with A and D or Left and Right. Fire with Space. Reset with R. Toggle metrics with H. Click the arena to focus.">RotorLoop needs Canvas 2D and JavaScript. W or Up: thrust. A/D or Left/Right: turn. Space: fire. R: reset. H: toggle metrics.</canvas>
      <div id="ui-root" class="ui-layer"></div>
      <p id="status-live" class="sr-only" aria-live="polite"></p>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
